spring.application.name=alerta-cheia-api
server.port=8080

# ---------- Oracle (padrao) ----------
# Defina as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD (veja o README).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:rmXXXXX}
spring.datasource.password=${DB_PASSWORD:senha}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# As tabelas sao criadas pelo database/alerta_cheia.sql; o Hibernate so confere se batem.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Seguranca ----------
# Em producao, troque por um segredo forte via variavel de ambiente JWT_SECRET (min. 32 caracteres).
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-alerta-cheia-2026}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MIN:480}
# Chave que os sensores enviam no header X-Sensor-Key
app.sensor.api-key=${SENSOR_API_KEY:sensor-dev-key-123}
# Origens liberadas no CORS (Expo web, por exemplo). Separe por virgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# Nunca expor stack trace ao cliente
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
